services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishshield-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/scans.db
      - MODEL_ARTIFACT_PATH=/app/artifacts/model.joblib
      - MODEL_METADATA_PATH=/app/artifacts/model_metadata.json
      - FEATURE_SCHEMA_PATH=/app/artifacts/feature_schema.json
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:80
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
