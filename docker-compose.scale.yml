# =============================================================================
# Phishing Website Detection Platform - Multi-Instance Scaled Deployment Profile
# =============================================================================
# Architecture:
#   [ Client Traffic ]
#          │ (Port 80/443)
#          ▼
#   ┌───────────────────────────────┐
#   │ Nginx Load Balancer (Reverse) │
#   └───────┬───────────────┬───────┘
#           │ /api/         │ /
#     ┌─────┴─────┐         ▼
#     │           │   ┌───────────┐
#     ▼           ▼   │ Frontend  │
# ┌───────┐   ┌───────┐ └───────────┘
# │Backend│   │Backend│   (Nginx SPA)
# │Node 1 │...│Node 3 │
# └───┬───┘   └───┬───┘
#     └─────┬─────┘
#           ▼
#    ┌─────────────┐
#    │ Shared      │
#    │ PostgreSQL  │
#    └─────────────┘
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Shared PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: phishshield-scale-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishpassword}
      POSTGRES_DB: ${POSTGRES_DB:-phishshield}
    # Security: Database is NOT exposed to the host machine.
    # Only accessible across the isolated container bridge network.
    volumes:
      - pgdata_scale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishuser} -d ${POSTGRES_DB:-phishshield}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - phishshield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend Instance 1
  # ---------------------------------------------------------------------------
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishshield-backend-1
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-phishuser}:${POSTGRES_PASSWORD:-phishpassword}@db:5432/${POSTGRES_DB:-phishshield}
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - RATE_LIMIT_PER_MINUTE=600
      - MODEL_DIR=/app/artifacts
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/readiness')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - phishshield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. FastAPI Backend Instance 2
  # ---------------------------------------------------------------------------
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishshield-backend-2
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-phishuser}:${POSTGRES_PASSWORD:-phishpassword}@db:5432/${POSTGRES_DB:-phishshield}
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - RATE_LIMIT_PER_MINUTE=600
      - MODEL_DIR=/app/artifacts
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/readiness')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - phishshield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. FastAPI Backend Instance 3
  # ---------------------------------------------------------------------------
  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishshield-backend-3
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-phishuser}:${POSTGRES_PASSWORD:-phishpassword}@db:5432/${POSTGRES_DB:-phishshield}
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - RATE_LIMIT_PER_MINUTE=600
      - MODEL_DIR=/app/artifacts
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/readiness')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - phishshield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5. React Frontend Single Page Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishshield-scale-frontend
    # Internal exposure only; Nginx load balancer serves client traffic
    networks:
      - phishshield-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Nginx Load Balancer and Gateway Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: phishshield-load-balancer
    ports:
      # Public entrypoint for user traffic and load testing
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - phishshield-net
    restart: unless-stopped

networks:
  phishshield-net:
    driver: bridge

volumes:
  pgdata_scale:
