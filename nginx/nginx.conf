user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream timing for performance observability
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # Performance & Network I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Strict Request Size Boundaries (defense against payload exhaustion / DoS)
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    # Connection and Request Rate Limiting zones
    # 10m zone stores ~160,000 IP states
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=100r/s;

    # Upstream Backend Cluster
    # Uses least_conn algorithm to route requests to the worker with the fewest active requests.
    # Keepalive pool avoids per-request TCP handshakes between Nginx and Uvicorn.
    upstream backend_cluster {
        least_conn;

        # Backend instances (configured in docker-compose.scale.yml)
        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
        server backend3:8000 max_fails=3 fail_timeout=10s;

        # Maintain 32 idle keepalive connections to upstream backends
        keepalive 32;
    }

    # Upstream Frontend Container
    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection Limit: Max 50 simultaneous TCP connections per remote IP
        limit_conn addr_conn_limit 50;

        # Health monitoring endpoint for the load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Routes - Load Balanced to FastAPI Cluster
        location /api/ {
            # Forward to backend pool
            proxy_pass http://backend_cluster;

            # HTTP 1.1 with Connection: "" enables upstream HTTP keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard Forwarded Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts: short connect timeout to rapidly failover unresponsive backends
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Automatic Failover: retry next upstream if instance returns errors or timeouts
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Buffering for performance and memory bounding
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;

            # Rate Limiting: burst capacity up to 50 requests with nodelay
            limit_req zone=api_rate_limit burst=50 nodelay;
        }

        # Frontend Static Files & SPA Routing
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # PRODUCTION TLS / SSL CONFIGURATION GUIDANCE
    # =========================================================================
    # In production, terminate TLS at Nginx and redirect port 80 to 443:
    #
    # server {
    #     listen 80;
    #     server_name phishshield.example.com;
    #     return 301 https://$host$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name phishshield.example.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     # Modern TLS Configuration (TLS 1.2 and 1.3 only)
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS (Strict-Transport-Security)
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # OCSP Stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 1.1.1.1 8.8.8.8 valid=300s;
    #     resolver_timeout 5s;
    # }
}
